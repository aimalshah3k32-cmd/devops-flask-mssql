version: '3.8'

services:
  # Microsoft SQL Server 2022 Container
  # Connect via SSMS on Windows Host at: localhost,1433 (Login: sa, Pass: Passw0rd2026!)
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: devops_sqlserver
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Passw0rd2026!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - devops_net

  # Python Flask API Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flask_api_container
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_SERVER=sqlserver
      - DB_PORT=1433
      - DB_NAME=master
      - DB_USER=sa
      - DB_PASSWORD=Passw0rd2026!
      - MSSQL_SA_PASSWORD=Passw0rd2026!
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - PORT=5000
    depends_on:
      - sqlserver
    volumes:
      - ./backend:/app
    networks:
      - devops_net

volumes:
  mssql_data:
    driver: local

networks:
  devops_net:
    driver: bridge
